<style>

*{box-sizing:border-box} html,body{margin:0;height:100%;background:#0b0e12;color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}

<script id="simsrc" type="text/plain">
'use strict';
// ===================== WATERSHED SIM CORE (runs in a Web Worker) =====================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeNoise(seed){
  const rnd=mulberry32(seed), perm=[]; for(let i=0;i<256;i++)perm[i]=i;
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=perm[i];perm[i]=perm[j];perm[j]=t;}
  const p=new Uint8Array(512); for(let i=0;i<512;i++)p[i]=perm[i&255];
  const GX=[1,-1,1,-1,1,-1,0,0], GY=[1,1,-1,-1,0,0,1,-1];
  const F2=0.5*(Math.sqrt(3)-1), G2=(3-Math.sqrt(3))/6;
  return function(x,y){
    const s=(x+y)*F2, i=Math.floor(x+s), j=Math.floor(y+s), t=(i+j)*G2;
    const x0=x-(i-t), y0=y-(j-t); const i1=x0>y0?1:0, j1=1-i1;
    const x1=x0-i1+G2, y1=y0-j1+G2, x2=x0-1+2*G2, y2=y0-1+2*G2, ii=i&255, jj=j&255;
    let n=0, a;
    a=0.5-x0*x0-y0*y0; if(a>0){a*=a;const g=p[ii+p[jj]]&7; n+=a*a*(GX[g]*x0+GY[g]*y0);}
    a=0.5-x1*x1-y1*y1; if(a>0){a*=a;const g=p[ii+i1+p[jj+j1]]&7; n+=a*a*(GX[g]*x1+GY[g]*y1);}
    a=0.5-x2*x2-y2*y2; if(a>0){a*=a;const g=p[ii+1+p[jj+1]]&7; n+=a*a*(GX[g]*x2+GY[g]*y2);}
    return 70*n;
  };
}
// ===================== REALM: contiguous tiles from one global terrain =====================
const RT = 110;                                   // tile radius (hexes)
const REALM_TILES = { N:{q:RT, r:-2*RT-1, name:'North uplands', down:'C'}, C:{q:0, r:0, name:'Middle valley', up:'N', down:'S'}, S:{q:-RT, r:2*RT+1, name:'South coast', up:'C'} };
const REALM_ORDER = ['N','C','S'];
function tileXY(t){ const T=REALM_TILES[t]; return [Math.sqrt(3)*(T.q+T.r/2), 1.5*T.r]; }
function makeRealmH(seed){
  const n1=makeNoise(seed*7+1), n2=makeNoise(seed*7+2), n3=makeNoise(seed*7+3), n4=makeNoise(seed*7+4), n5=makeNoise(seed*7+5);
  const fbm=(nz,x,y,o)=>{let s=0,a=1,f=1,t=0;for(let k=0;k<o;k++){s+=a*nz(x*f,y*f);t+=a;a*=0.5;f*=2.03;}return s/t;};
  const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
  const rr=mulberry32(seed*13+5); const vx=-40+rr()*80, vy=-385+rr()*40, fx=30+rr()*50, fy=-120+rr()*60, meander=0.6+rr()*0.8;
  const H=function(x,y){
    const ny=y/500;
    let h = 150*(0.42-0.62*ny) + 48*fbm(n1,x/230,y/230,4);
    const rg=1-Math.abs(fbm(n2,x/80,y/80,4)); h += 85*rg*rg*rg*ss(0.1,-0.5,ny)*ss(-0.1,0.4,fbm(n3,x/260+3,y/260,3));
    const vxm = 40*Math.sin(y/170*meander)+20*fbm(n4,y/90,1.3,2); h -= 30*Math.exp(-((x-vxm)*(x-vxm))/(2*45*45))*ss(-0.9,-0.2,ny);   // a main valley north→south
    const dv=Math.hypot(x-vx,y-vy); h += 175*Math.exp(-dv/28)+55*Math.exp(-dv/80)-10*Math.exp(-dv*dv/6);
    const df=Math.hypot(x-fx,y-fy); h += 38*Math.exp(-df/14);
    h -= 240*ss(0.78,1.08, ny+0.12*fbm(n5,x/180,0.7,3));                                           // the southern sea
    h += 9*fbm(n4,x/22,y/22,3) + 14;
    const xc=35*Math.sin(y/260*meander);                                                              // the realm's axis
    h += 120*ss(60,175,Math.abs(x-xc)) + 110*ss(-430,-540,y);                                         // flanking ranges + a northern rim funnel water south
    if(h>0) h=h*0.6+Math.pow(h,1.2)*0.08;

}
// rock types: 0 natural, 1 earth fill, 2 basalt, 3 obsidian
const ROCK_S = [0, 1.0, 3.0, 9.0];   // erosion resistance of built / volcanic rock
function makeSim(R, seed, opts){
  opts=opts||{};
  const W=2*R+5, N=W*W, OFF=R+2, SQ3=Math.sqrt(3);
  const idx=(q,r)=>(r+OFF)*W+(q+OFF);
  const NB=[1,1-W,-W,-1,-1+W,W];
  const valid=new Uint8Array(N), qOf=new Int16Array(N), rOf=new Int16Array(N), cx=new Float32Array(N), cy=new Float32Array(N);
  for(let i=0;i<N;i++){ qOf[i]=i%W-OFF; rOf[i]=((i/W)|0)-OFF; cx[i]=SQ3*(qOf[i]+rOf[i]/2); cy[i]=1.5*rOf[i]; }
  for(let r=-R;r<=R;r++) for(let q=-R;q<=R;q++) if(Math.abs(q+r)<=R) valid[idx(q,r)]=1;
  const act=[], sea=[];
  for(let i=0;i<N;i++){ const row=(i/W)|0, col=i%W; if(row<1||row>W-2||col<1||col>W-2) continue;
    if(valid[i]){act.push(i);continue;} for(let d=0;d<6;d++) if(valid[i+NB[d]]){act.push(i);sea.push(i);break;} }
  const ACT=Int32Array.from(act), SEA=Int32Array.from(sea), VAL=Int32Array.from(act.filter(i=>valid[i]));
  const hexDist=(i,j)=>{ const dq=qOf[i]-qOf[j], dr=rOf[i]-rOf[j]; return (Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2; };
  const h=new Float32Array(N), h0=new Float32Array(N), w=new Float32Array(N), m=new Float32Array(N);
  const L=new Float32Array(N), E=new Float32Array(N), qAcc=new Float32Array(N), aAcc=new Float32Array(N), Tc=new Float32Array(N);
  const rock=new Uint8Array(N), wallS=new Float32Array(N), heat=new Float32Array(N), rain=new Float32Array(N), flowOut=new Float32Array(N), flowDay=new Float32Array(N);
  const F0=new Float32Array(N),F1=new Float32Array(N),F2=new Float32Array(N), FF=[F0,F1,F2], out=new Float32Array(N), tmp=new Float32Array(N);
  const G0=new Float32Array(N),G1=new Float32Array(N),G2=new Float32Array(N), FL=[G0,G1,G2], lout=new Float32Array(N);
  const rnd=mulberry32(seed^0x9e37);
  const P={ KP:0.15, DAMP:0.985, drizzle:1.2e-5, evap:2.5e-5, KL:0.09, coolAir:0.0016, coolWater:0.035, steamK:0.6, Ts:0.32,
            yearSteps:2400, step:0, runoff:0, hChanged:false, events:[], collected:{}, coll:[], vents:[], storms:[], wind:0.6 };

  // ---------------- generation ----------------
  let BIN=null, BKIND=null, BIN_IN=null;                // tile mode: boundary cells, kind (0 sea,1 land), inner neighbour
  function generate(){ if(opts.tile) return generateTile(); if(opts.board) return generateBoard();
    const n1=makeNoise(seed), n2=makeNoise(seed+1), n3=makeNoise(seed+2), n4=makeNoise(seed+3);
    const fbm=(nz,x,y,o)=>{let s=0,a=1,f=1,t=0;for(let k=0;k<o;k++){s+=a*nz(x*f,y*f);t+=a;a*=0.5;f*=2.03;}return s/t;};
    const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
    // main volcano somewhere in the inner half; maybe a second fissure field
    const ang=rnd()*Math.PI*2, rad=R*(0.15+0.3*rnd());
    const px0=rad*Math.cos(ang), py0=rad*Math.sin(ang); const vq=Math.round(SQ3/3*px0-py0/3), vr=Math.round(2/3*py0);
    let v0=idx(vq, vr); if(!valid[v0]) v0=idx(0,0);
    const vx=cx[v0], vy=cy[v0];
    for(let i=0;i<N;i++){
      if(!valid[i]){ h[i]=-30; continue; }
      const x=cx[i], y=cy[i], d=hexDist(i, idx(0,0))/R;
      const base=0.5+0.7*fbm(n1,x/170,y/170,4)-1.35*ss(0.62,0.98,d);
      const rg=1-Math.abs(fbm(n2,x/70,y/70,4)); const ridge=rg*rg*rg*ss(0.1,0.5,fbm(n3,x/220+9,y/220-3,3));
      const dv=Math.hypot(x-vx,y-vy);
      let hh = 70*base + 120*ridge*Math.max(0,Math.min(1,base*2.5)) + 10*fbm(n4,x/22,y/22,3);
      hh += 150*Math.exp(-dv/22) + 45*Math.exp(-dv/60) - 10*Math.exp(-(dv*dv)/6);
      if(hh>0) hh=hh*0.6+Math.pow(hh,1.2)*0.08;
      h[i]=hh;
    }
    // fill depressions with a gentle slope (keep a few big lakes)
    const Fs=new Float32Array(N), parent=new Int32Array(N).fill(-1), seen=new Uint8Array(N), order=new Int32Array(VAL.length); let on=0;
    const heapI=new Int32Array(N), heapV=new Float32Array(N); let hn=0;
    const push=(i,v)=>{let k=hn++; while(k>0){const pk=(k-1)>>1; if(heapV[pk]<=v)break; heapI[k]=heapI[pk];heapV[k]=heapV[pk];k=pk;} heapI[k]=i;heapV[k]=v;};
    const pop=()=>{const top=heapI[0]; const li=heapI[--hn], lv=heapV[hn]; let k=0; for(;;){let c=2*k+1; if(c>=hn)break; if(c+1<hn&&heapV[c+1]<heapV[c])c++; if(heapV[c]>=lv)break; heapI[k]=heapI[c];heapV[k]=heapV[c];k=c;} heapI[k]=li;heapV[k]=lv; return top;};
    for(const s of SEA){ seen[s]=1; for(let d=0;d<6;d++){const j=s+NB[d]; if(valid[j]&&!seen[j]){seen[j]=1; Fs[j]=Math.max(h[j],0); push(j,Fs[j]);}} }
    while(hn>0){ const c=pop(); order[on++]=c; for(let d=0;d<6;d++){ const j=c+NB[d]; if(!valid[j]||seen[j]) continue; seen[j]=1; Fs[j]=Math.max(h[j],Fs[c]+(Fs[c]>0?0.03:0)); parent[j]=c; push(j,Fs[j]); } }
    { const lab=new Int32Array(N).fill(-1), comps=[], stack=[];
      for(const i of VAL){ if(lab[i]>=0||Fs[i]-h[i]<0.05||Fs[i]<=0.001) continue; const id=comps.length; let area=0,depth=0; lab[i]=id; stack.push(i);
        while(stack.length){ const c=stack.pop(); area++; depth=Math.max(depth,Fs[c]-h[c]); for(let d=0;d<6;d++){ const j=c+NB[d]; if(valid[j]&&lab[j]<0&&Fs[j]-h[j]>=0.05&&Fs[j]>0.001){lab[j]=id;stack.push(j);} } }
        comps.push({id,area,depth}); }
      comps.sort((a,b)=>b.area*Math.min(b.depth,15)-a.area*Math.min(a.depth,15)); const keep=new Uint8Array(comps.length); let tot=0;
      for(const c of comps){ if(c.depth<3||c.area<25) continue; if(tot+c.area>0.03*VAL.length) continue; keep[c.id]=1; tot+=c.area; }
      for(const i of VAL){ const l=lab[i]; if(l>=0&&!keep[l]) h[i]=Fs[i]; else if(l>=0) h[i]=Math.max(h[i], Fs[i]-1.6); }   // natural lakes are shallow seasonal stores

    let top=v0; for(let k=0;k<200;k++){ let best=top; for(let d=0;d<6;d++){ const j=top+NB[d]; if(valid[j]&&hexDist(j,v0)<6&&h[j]<h[best]) best=j; } if(best===top) break; top=best; }
    addVent(top, 0.006, 'Great Vent');
    if(rnd()<0.75){ for(let t=0;t<400;t++){ const a=rnd()*Math.PI*2, rr=40+rnd()*40; const q=Math.round(qOf[v0]+rr*Math.cos(a)), r=Math.round(rOf[v0]+rr*Math.sin(a)*0.8);
      if(Math.abs(q)>R||Math.abs(r)>R||Math.abs(q+r)>R) continue; const j=idx(q,r); if(valid[j]&&h[j]>25&&w[j]===0){ addVent(j, 0.003, 'Fissure'); break; } } }
    // spin up: a season of weather + lava history
    for(let k=0;k<500;k++) step(true);
    for(const i of VAL) m[i]=Math.min(1,m[i]);
    P.events.length=0; P.collected={};
  }
  function generateBoard(){
    const B=opts.board; for(let i=0;i<N;i++) h[i]=B.h? (B.h[i]||0) : 0;
    BKIND=new Uint8Array(SEA.length); SEA.forEach((s,k)=>{ BKIND[k]= (B.drains&&B.drains.includes(s))?1:2; if(BKIND[k]===2) h[s]=400; else h[s]=Math.min(h[s], -0.5); });
    P.edgeOut=new Float32Array(SEA.length); h0.set(h); P.noWeather=true; P.noErupt=true; P.vents=[]; heat.fill(0);
    if(B.lavaIn!==undefined) P.vents.push({i:B.lavaIn, base:B.lavaRate||0.03, name:'inlet', state:'quiet', t:0, mult:1});
    P.inflow = B.waterIn!==undefined ? {cells:Int32Array.from([B.waterIn]), rates:Float32Array.from([B.waterRate||0.1])} : null; }
  function boardMeasure(){ let obs=0, bas=0, wst=0, lav=0; for(const i of VAL){ const d=h[i]-h0[i]; if(rock[i]===3&&d>0) obs+=d; if(rock[i]===2&&d>0) bas+=d; wst+=w[i]; lav+=L[i]; } let out=0; for(let k=0;k<SEA.length;k++) out+=P.edgeOut[k]; return {obs, bas, wst, lav, out}; }
  function generateTile(){
    const T=REALM_TILES[opts.tile], H=makeRealmH(opts.realm); const [tx,ty]=tileXY(opts.tile);
    for(let i=0;i<N;i++) h[i]=H(cx[i]+tx, cy[i]+ty);
    BIN=SEA; BKIND=new Uint8Array(SEA.length); BIN_IN=new Int32Array(SEA.length);
    const up=T.up?REALM_TILES[T.up]:null;
    SEA.forEach((s,k)=>{ BKIND[k]= h[s]<0?0:1;
      if(up){ const gq=qOf[s]+T.q-up.q, gr=rOf[s]+T.r-up.r; if(Math.abs(gq)<=R&&Math.abs(gr)<=R&&Math.abs(gq+gr)<=R){ BKIND[k]=2; } }   // upstream edge: water arrives as inflow, never flows back
      for(let d=0;d<6;d++){ const j=s+NB[d]; if(valid[j]){ BIN_IN[k]=j; break; } } });

    // fill depressions draining to any boundary (sea at level 0, land boundaries at their own height)
    const Fs=new Float32Array(N), seen=new Uint8Array(N); const heapI=new Int32Array(N), heapV=new Float32Array(N); let hn=0;
    const push=(i,v)=>{let k=hn++; while(k>0){const pk=(k-1)>>1; if(heapV[pk]<=v)break; heapI[k]=heapI[pk];heapV[k]=heapV[pk];k=pk;} heapI[k]=i;heapV[k]=v;};
    const pop=()=>{const top=heapI[0]; const li=heapI[--hn], lv=heapV[hn]; let k=0; for(;;){let c=2*k+1; if(c>=hn)break; if(c+1<hn&&heapV[c+1]<heapV[c])c++; if(heapV[c]>=lv)break; heapI[k]=heapI[c];heapV[k]=heapV[c];k=c;} heapI[k]=li;heapV[k]=lv; return top;};
    SEA.forEach((s,k)=>{ seen[s]=1; if(BKIND[k]===2) return; const base=BKIND[k]?h[s]:0; for(let d=0;d<6;d++){ const j=s+NB[d]; if(valid[j]&&!seen[j]){ seen[j]=1; Fs[j]=Math.max(h[j],base); push(j,Fs[j]); } } });
    while(hn>0){ const c=pop(); for(let d=0;d<6;d++){ const j=c+NB[d]; if(!valid[j]||seen[j]) continue; seen[j]=1; Fs[j]=Math.max(h[j],Fs[c]+(Fs[c]>0?0.03:0)); push(j,Fs[j]); } }
    { const lab=new Int32Array(N).fill(-1), comps=[], stack=[];
      for(const i of VAL){ if(lab[i]>=0||Fs[i]-h[i]<0.05||Fs[i]<=0.001) continue; const id=comps.length; let area=0,depth=0; lab[i]=id; stack.push(i);
        while(stack.length){ const c=stack.pop(); area++; depth=Math.max(depth,Fs[c]-h[c]); for(let d=0;d<6;d++){ const j=c+NB[d]; if(valid[j]&&lab[j]<0&&Fs[j]-h[j]>=0.05&&Fs[j]>0.001){lab[j]=id;stack.push(j);} } }
        comps.push({id,area,depth}); }
      comps.sort((a,b)=>b.area*Math.min(b.depth,15)-a.area*Math.min(a.depth,15)); const keep=new Uint8Array(comps.length); let tot=0;
      for(const c of comps){ if(c.depth<3||c.area<25) continue; if(tot+c.area>0.025*VAL.length) continue; keep[c.id]=1; tot+=c.area; }
      for(const i of VAL){ const l=lab[i]; if(l>=0&&!keep[l]) h[i]=Fs[i]; else if(l>=0) h[i]=Math.max(h[i], Fs[i]-1.6); }
      for(const i of VAL){ const d=Fs[i]-h[i]; w[i]=d>0.02?d:0; } }
    SEA.forEach((s,k)=>{ w[s]= BKIND[k]? 0 : -h[s]; if(BKIND[k]===2) h[s]=h[s]+400; });
    h0.set(h);
    for(const v of H.vents){ const x=v.x-tx, y=v.y-ty; const q=Math.round(SQ3/3*x-y/3), r=Math.round(2/3*y);
      if(Math.abs(q)<=R && Math.abs(r)<=R && Math.abs(q+r)<=R){ let c=idx(q,r); for(let k=0;k<60;k++){ let best=c; for(let d=0;d<6;d++){ const j=c+NB[d]; if(valid[j]&&h[j]<h[best]&&Math.hypot(cx[j]-x,cy[j]-y)<6) best=j; } if(best===c) break; c=best; }
        P.vents.push({ i:c, base:v.base, name:v.name, state:'quiet', t:0, mult:1 }); } }
    computeHeat();
    for(let k=0;k<400;k++) step(true);
    for(const i of VAL) m[i]=Math.min(1,m[i]);
    P.events.length=0; P.collected={}; P.edgeOut.fill(0); P.runoff=0;
  }
  function addVent(i, base, name){ const v={ i, base, name: name+(P.vents.length?(' '+(P.vents.length+1)):''), state:'quiet', t:0, mult:1 }; P.vents.push(v); computeHeat(); return v; }
  function computeHeat(){ if(!P.vents.length){ heat.fill(0); return; }
    const n=makeNoise(seed+9);
    for(const i of VAL){ let best=0; for(const v of P.vents){ const d=Math.hypot(cx[i]-cx[v.i],cy[i]-cy[v.i]); best=Math.max(best, Math.exp(-d/24)); } heat[i]=Math.min(1,best*(1+0.35*n(cx[i]/18,cy[i]/18))); }
  }

  // ---------------- weather ----------------
  function seasonF(){ const ph=(P.step%P.yearSteps)/P.yearSteps; return 1+0.85*Math.sin(2*Math.PI*ph); }  // wet peak 1/4, dry 3/4
  function weather(){ if(P.noWeather) return;
    const sf=seasonF(); const th = P.wind + 0.5*Math.sin(2*Math.PI*P.step/P.yearSteps*1.7);
    const ux=Math.cos(th), uy=Math.sin(th);
    const want = Math.max(0, Math.round(3.4*(sf-0.45)));
    if (P.storms.length < want && rnd() < 0.02){
      const off=(rnd()*2-1)*R*1.6, D=R*1.5+40;
      P.storms.push({ x:-ux*D - uy*off, y:-uy*D + ux*off, vx:ux*(0.35+0.25*rnd()), vy:uy*(0.35+0.25*rnd()), r:16+rnd()*22, amp:(0.0009+0.0012*rnd())*(0.6+0.4*sf), age:0 });
    }
    for (const s of P.storms){ s.x+=s.vx; s.y+=s.vy; s.age++; }
    P.storms = P.storms.filter(s => Math.hypot(s.x,s.y) < R*1.5+80 && s.age < 4000);
    const dz = P.drizzle*Math.max(0,sf-0.4);
    const lens = (P.step%4===0);
    if (lens) for (const i of VAL) rain[i]=dz;
    for (const i of VAL) w[i]+=dz;
    for (const s of P.storms){

    if (Math.abs(q)>RT||Math.abs(r)>RT||Math.abs(q+r)>RT){ im.data[o+3]=0; continue; }
    const h=H(wx+tx, wy+ty); let cr,cg,cb; if (h<0){ cr=30;cg=52;cb=86; } else { const k=Math.min(1,h/200); cr=120+70*k; cg=146-20*k; cb=76+50*k; }
    const g=(cr+cg+cb)/3; im.data[o]=g*0.55+cr*0.25; im.data[o+1]=g*0.55+cg*0.25; im.data[o+2]=g*0.55+cb*0.3; im.data[o+3]=255; }
  const hs=new Float32Array(TH*TH), inside=new Uint8Array(TH*TH); for (let py=0;py<TH;py++) for (let px=0;px<TH;px++){ const wx=(px-TH/2)/sc, wy=(py-TH/2)/sc; const q=SQ3/3*wx-wy/3, r=2/3*wy; const k=py*TH+px; inside[k]= (Math.abs(q)<=RT&&Math.abs(r)<=RT&&Math.abs(q+r)<=RT)?1:0; hs[k]=H(wx+tx,wy+ty); }
  const ord=[...Array(TH*TH).keys()].filter(k=>inside[k]).sort((a,b)=>hs[b]-hs[a]); const acc=new Float32Array(TH*TH).fill(1);
  for (const k of ord){ const px=k%TH, py=(k/TH)|0; let best=-1, bh=hs[k]; for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const X=px+dx, Y=py+dy; if (X<0||Y<0||X>=TH||Y>=TH) continue; const j=Y*TH+X; if (hs[j]<bh){ bh=hs[j]; best=j; } } if (best>=0) acc[best]+=acc[k]; }
  for (const k of ord){ if (acc[k]>60 && hs[k]>0){ const o=k*4, a=Math.min(1,Math.log(acc[k]/60)/3); im.data[o]=im.data[o]*(1-a)+70*a; im.data[o+1]=im.data[o+1]*(1-a)+150*a; im.data[o+2]=im.data[o+2]*(1-a)+235*a; } }
  x.putImageData(im,0,0); survey[t]=c; return c; }
const thumbs = {};
function thumbFor(t){ const s=tileSave(t); if (!s||!s.thumb) return null; if (thumbs[t]&&thumbs[t].src===s.thumb) return thumbs[t].img; const img=new Image(); img.src=s.thumb; img.onload=draw; thumbs[t]={src:s.thumb, img}; return img; }
function layout(){ CW=cv.clientWidth; CH=cv.clientHeight; cv.width=CW; cv.height=CH; const span=3*1.5*(2*RT+1)+90; SC=Math.min(CW/(SQ3*(2*RT+1)*1.9), CH/span); OX=CW/2+0; OY=CH/2; draw(); }
window.addEventListener('resize', layout);
function tileScreen(t){ const [tx,ty]=tileXY(t); return [OX+tx*SC, OY+ty*SC]; }
function flowsBetween(){ // annual & dry flow from each tile into its downstream neighbour, from cards
  const out={}; for (const t of REALM_ORDER){ const T=REALM_TILES[t]; const c=(RS.tiles[t]||{}).card; if (!c||!T.down) continue; const D=REALM_TILES[T.down]; let tot=0, dry=0;
    for (const k in c.edge){ const i=+k; const gq=i%W-OFF+T.q, gr=((i/W)|0)-OFF+T.r; const q=gq-D.q, r=gr-D.r; if (Math.abs(q)>RT||Math.abs(r)>RT||Math.abs(q+r)>RT) continue; c.edge[k].forEach((v,b)=>{ tot+=v*10; if (b>=17&&b<=27) dry+=v*10; }); }
    out[t]={tot,dry}; } return out; }
function draw(){
  ctx.clearRect(0,0,CW,CH); ctx.fillStyle='#0b0e12'; ctx.fillRect(0,0,CW,CH);
  const size=SQ3*(2*RT+1)*SC;
  for (const t of REALM_ORDER){ const [sx,sy]=tileScreen(t); const img=thumbFor(t)||surveyImage(t); ctx.globalAlpha = (RS.tiles[t]||{}).status==='settled'?1:0.75; ctx.drawImage(img, sx-size/2, sy-size/2, size, size); ctx.globalAlpha=1;
    ctx.font='bold 14px system-ui'; ctx.textAlign='right'; ctx.fillStyle='#e7e9ec'; ctx.fillText(REALM_TILES[t].name, sx-size*0.52, sy-4);
    const st=(RS.tiles[t]||{}).status; ctx.font='12px system-ui'; ctx.fillStyle= st==='settled'?'#6fd38b':'#8d96a2'; ctx.fillText(st==='settled'?'settled':'wild', sx-size*0.52, sy+13); ctx.textAlign='center'; }
  // vents and capital
  for (const v of H.vents){ const x=OX+v.x*SC, y=OY+v.y*SC; ctx.fillStyle='#ff6a2a'; ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x+7,y+5); ctx.lineTo(x-7,y+5); ctx.closePath(); ctx.fill(); ctx.font='11px system-ui'; ctx.fillStyle='#ffcf9a'; ctx.fillText(v.name, x, y+18); }
  const sSave=tileSave('S'); if (sSave){ const cap=sSave.buildings.find(b=>b.type==='capital'); if (cap){ const i=cap.i, q=i%W-OFF, r=((i/W)|0)-OFF; const [tx,ty]=tileXY('S'); const x=OX+(SQ3*(q+r/2)+tx)*SC, y=OY+(1.5*r+ty)*SC; ctx.fillStyle='#ffd36b'; ctx.font='18px system-ui'; ctx.fillText('♛', x, y+6); ctx.font='11px system-ui'; ctx.fillText('capital', x, y+20); } }
  const spark=(x,y,bins,title,dem)=>{ const Wd=150, Hd=44; ctx.fillStyle='rgba(12,16,22,0.88)'; ctx.fillRect(x,y,Wd,Hd+16); ctx.fillStyle='rgba(255,184,107,0.13)'; ctx.fillRect(x+Wd*17/30,y+14,Wd*11/30,Hd);
    const mx=Math.max(1e-6,...bins, dem||0); ctx.fillStyle='#7cc4ff'; bins.forEach((v,k)=>{ const bh=Hd*v/mx; ctx.fillRect(x+k*Wd/30, y+14+Hd-bh, Wd/30-1, bh); });
    if (dem){ const yy=y+14+Hd-Hd*dem/mx; ctx.setLineDash([4,3]); ctx.strokeStyle='#ffd36b'; ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+Wd,yy); ctx.stroke(); ctx.setLineDash([]); }
    ctx.font='11px system-ui'; ctx.textAlign='left'; ctx.fillStyle='#cfe6ff'; ctx.fillText(title, x+3, y+11); ctx.textAlign='center'; };
  const binsInto=(t)=>{ const T=REALM_TILES[t], c=(RS.tiles[t]||{}).card; const out=new Array(30).fill(0); if (!c||!T.down) return out; const D=REALM_TILES[T.down];
    for (const k in c.edge){ const i=+k; const gq=i%W-OFF+T.q, gr=((i/W)|0)-OFF+T.r; const q=gq-D.q, r=gr-D.r; if (Math.abs(q)>RT||Math.abs(r)>RT||Math.abs(q+r)>RT) continue; c.edge[k].forEach((v,b)=>out[b]+=v); } return out; };
  const size2=SQ3*(2*RT+1)*SC;
  for (const t of ['N','C']){ const D=REALM_TILES[t].down; const [x1,y1]=tileScreen(t), [x2,y2]=tileScreen(D); spark(OX-size2*0.5-160, (y1+y2)/2-30, binsInto(t), `${REALM_TILES[t].name} → ${REALM_TILES[D].name}, /day`, 0); }
  const scd=(RS.tiles.S||{}).card; if (scd&&scd.capital){ const dem=demand(RS.year); const [sx,sy]=tileScreen('S'); const inb=binsInto('C'); const X=OX-size2*0.5-160, Y=sy+size2*0.15;
    spark(X, Y, scd.capital, 'at the capital (blue) of what arrives (grey), /day', dem.dry? dem.dry/110 : 0);
    const mx=Math.max(1e-6,...scd.capital,...inb, dem.dry/110||0); ctx.fillStyle='rgba(180,190,205,0.28)'; inb.forEach((v,k)=>{ const bh=44*v/mx; ctx.fillRect(X+k*150/30, Y+14+44-bh, 150/30-1, bh); });
    ctx.fillStyle='#7cc4ff'; scd.capital.forEach((v,k)=>{ const bh=44*v/mx; ctx.fillRect(X+k*150/30, Y+14+44-bh, 150/30-1, bh); }); if (dem.dry){ const yy=Y+14+44-44*(dem.dry/110)/mx; ctx.setLineDash([4,3]); ctx.strokeStyle='#ffd36b'; ctx.beginPath(); ctx.moveTo(X,yy); ctx.lineTo(X+150,yy); ctx.stroke(); ctx.setLineDash([]); } }
  // flows between tiles
  const fl=flowsBetween(); for (const t in fl){ const D=REALM_TILES[t].down; const [x1,y1]=tileScreen(t), [x2,y2]=tileScreen(D); const mx=(x1+x2)/2, my=(y1+y2)/2; const wdt=Math.max(2,Math.min(16,Math.sqrt(fl[t].tot)/12));
    ctx.strokeStyle='rgba(124,196,255,0.85)'; ctx.lineWidth=wdt; ctx.beginPath(); ctx.moveTo(mx,my-30); ctx.lineTo(mx,my+18); ctx.stroke(); ctx.fillStyle='rgba(124,196,255,0.95)'; ctx.beginPath(); ctx.moveTo(mx-wdt-5,my+14); ctx.lineTo(mx+wdt+5,my+14); ctx.lineTo(mx,my+30); ctx.closePath(); ctx.fill();
    ctx.font='12px system-ui'; ctx.textAlign='left'; ctx.fillStyle='#cfe6ff'; const lx=OX+size*0.55; ctx.fillText(`${Math.round(fl[t].tot)} water/yr`, lx, my-2); ctx.fillText(`${Math.round(fl[t].dry)} in the dry season`, lx, my+13);
    ctx.strokeStyle='rgba(124,196,255,0.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(mx+wdt+4,my); ctx.lineTo(lx-4,my); ctx.stroke(); ctx.textAlign='center'; }
}

// ---------- panel ----------
function tileSummary(t){ const c=(RS.tiles[t]||{}).card; if (!c) return '<span class="dim">no card yet</span>';
  const cap=(c.capital||[]).reduce((a,b)=>a+b,0)*10; const fl=flowsBetween()[t];
  return `${fl?`→ ${Math.round(fl.tot)} water (${Math.round(fl.dry)} dry) · `:''}${t==='S'?`capital ${Math.round(cap)} · `:''}lava ${Math.round(c.lava||0)} · obsidian ${Math.round(c.obsidian||0)} <span class="dim">(${c.realmYear===RS.year?'this year, played':'realm year '+c.realmYear+(c.headless?', simulated':'')})</span>`; }
function render(){
  const d=demand(RS.year), last=RS.history[RS.history.length-1];
  let h=`<h2>⬡ Realm ${REALM}</h2><div class="dim">Three tiles of one landscape. Rain falls on the north; rivers run south through the valley to the coast, where the capital takes delivery. What leaves one tile's edge is the next tile's inflow.</div>
  <div class="box"><b>Realm year ${RS.year}</b> · credits <b>${Math.round(RS.credits)}</b><div style="margin-top:4px">The capital asks for <b>${Math.round(100*(demand(RS.year).share||0))}%</b> of the dry-season water the wild rivers bring to the coast (${Math.round(RS.wildDry||0)}). Its ask rises only when you meet it, up to 100% — getting that much to the capital is the job. <b>Surplus contract:</b> every dry-season unit beyond the wild flow (only upstream storage can make it) pays 0.25 credits. This year: <b>${d.dry}</b> dry-season water · <b>${d.obs}</b> obsidian · <b>${d.lava}</b> lava</div>
  ${last?`<div class="dim" style="margin-top:4px">Last year: dry water ${Math.round(last.dry)} / ${last.dem.dry} · obsidian ${Math.round(last.obs)} / ${last.dem.obs} · lava ${Math.round(last.lava)} / ${last.dem.lava} → +${Math.round(last.value)} credits ${last.met?'<span class="good">(demand met, +50% bonus)</span>':'<span class="warn">(demand missed)</span>'}</div>`:''}
  <div style="margin-top:6px"><button class="b on" id="close">Close the realm year</button> <span class="dim" id="closeMsg">Simulates every tile for a year in order, north to south, and settles the capital's accounts.</span></div></div>`;
  for (const t of REALM_ORDER){ const st=(RS.tiles[t]||{}).status==='settled'; const cost=SETTLE_COST[t];
    h+=`<div class="box tile"><div style="display:flex;justify-content:space-between"><b>${REALM_TILES[t].name}</b><span>${st?'<span class="good">settled</span>':'<span class="dim">wild</span>'}</span></div>
      <div style="font-size:12px;margin:3px 0">${tileSummary(t)}</div>
      ${st?`<a class="b on" href="watershed.html?realm=${REALM}&tile=${t}">Play this tile</a>`
          : `<button class="b ${RS.credits>=cost?'on':''}" data-settle="${t}" ${RS.credits>=cost?'':'disabled'}>Settle (${cost?cost+' credits':'free'})</button> <span class="dim">${cost&&RS.credits<cost?'earn credits by meeting the capital\'s demand':''}</span>`}</div>`; }
  h+=`<div class="box dim" style="font-size:12px"><b>Reading the map.</b> Blue bars: water crossing into the next tile through the year; the shaded part is the dry season (worth 3×). The dashed gold line is the daily dry-season delivery the capital wants. <b>How it fits together.</b> Each tile is a full simulation you play like the island. When a tile finishes a year (day 300) it writes a <b>card</b>: how much water left each edge, season by season, plus its lava and obsidian. The tile downstream feels that card as inflow. Tiles you aren't playing are simulated headlessly when you close the year. Settling a new tile lets you <b>apply a blueprint</b> of what you built elsewhere — re-solved for the new terrain.</div>
  <div class="box dim" style="font-size:12px">Storage: ${RS.tiles?Object.keys(RS.tiles).length:0} tiles · <button class="b" id="reset">Abandon this realm</button> · <a class="b" href="realm.html">New realm</a></div>`;
  $('#panel').innerHTML=h;
  document.querySelectorAll('[data-settle]').forEach(b=>b.onclick=()=>{ const t=b.dataset.settle; RS.credits-=SETTLE_COST[t]; RS.tiles[t]=Object.assign(RS.tiles[t]||{}, {status:'settled'}); save(RS); location.href=`watershed.html?realm=${REALM}&tile=${t}`; });
  $('#close').onclick=closeYear;
  $('#reset').onclick=()=>{ if (!confirm('Delete this realm and all its tiles?')) return; for (const t of REALM_ORDER) localStorage.removeItem(`ws-tile-${REALM}-${t}`); localStorage.removeItem(RKEY); location.href='realm.html'; };
  draw();
}

// ---------- headless year ----------
const worker = new Worker(URL.createObjectURL(new Blob([SIMSRC], {type:'text/javascript'})));
const pending = {}; let reqId=0;
worker.onmessage = e => { const m=e.data; if (m.type==='tileCard' && pending[m.id]){ pending[m.id](m.card); delete pending[m.id]; } };
function runTile(t, inflow){ return new Promise(res=>{ const id=++reqId; pending[id]=res; const s=tileSave(t);
  worker.postMessage({type:'runTile', id, R:RT, seed:REALM*100+REALM_ORDER.indexOf(t), tile:t, realm:REALM, inflow, restore: s?{dh:s.dh, rock:s.rock}:null, coll: s? s.coll.map(c=>Object.assign({},c,{held:0})) : [], quarries: s? s.quarries : [] }); }); }
function inflowFor(t, cards){ const T=REALM_TILES[t]; if (!T.up) return []; const c=cards[T.up]; if (!c) return []; const U=REALM_TILES[T.up]; const out=[];
  for (const k in c.edge){ const i=+k; const gq=i%W-OFF+U.q, gr=((i/W)|0)-OFF+U.r; const q=gq-T.q, r=gr-T.r; if (Math.abs(q)>RT||Math.abs(r)>RT||Math.abs(q+r)>RT) continue; out.push({cell:(r+OFF)*W+(q+OFF), bins:c.edge[k]}); } return out; }
async function closeYear(){
  const btn=$('#close'); btn.disabled=true; const msg=$('#closeMsg'); const cards={};
  for (const t of REALM_ORDER){ const cur=(RS.tiles[t]||{}).card;
    if (cur && cur.realmYear===RS.year && !cur.headless){ cards[t]=cur; msg.textContent=`${REALM_TILES[t].name}: using the year you played.`; continue; }
    msg.textContent=`Simulating the ${REALM_TILES[t].name} for a year…`; await new Promise(r=>setTimeout(r,30));
    const c=await runTile(t, inflowFor(t,cards)); c.realmYear=RS.year; c.headless=true; cards[t]=c;
    RS.tiles[t]=Object.assign(RS.tiles[t]||{status:'wild'}, {card:c}); draw(); }
  // the capital's accounts
  const S=cards.S; let dry=0, value=0; (S.capital||[]).forEach((v,b)=>{ const amt=v*10; value+=amt*price(b); if (b>=17&&b<=27) dry+=amt; });
  let lava=0, obs=0; for (const t of REALM_ORDER){ const c=cards[t]; if ((RS.tiles[t]||{}).status!=='settled') continue; lava+=c.lava||0; obs+=c.obsidian||0; }
  value+=3*lava+10*obs; const dem=demand(RS.year); const met = dry>=dem.dry && obs>=dem.obs && lava>=dem.lava;
  const frac=(a,b)=>b>0? Math.min(1,a/b) : 1; const surplus=Math.max(0, dry-(RS.wildDry||0));
  value = 220*frac(dry,dem.dry) + (dem.obs?80*frac(obs,dem.obs):0) + (dem.lava?80*frac(lava,dem.lava):0) + (met?150:0) + 0.02*value + 0.25*surplus;   // a met year buys the next tile; dry water beyond the wild flow is a surplus contract
  RS.history.push({year:RS.year, dry, lava, obs, value, met, dem}); RS.credits+=value; RS.year++; save(RS);
  msg.innerHTML = `Year closed: <b>+${Math.round(value)}</b> credits${met?' — the capital is satisfied.':'.'}`; btn.disabled=false; render();
}
async function runSurvey(){ if (RS.surveyed) return; const msg=document.createElement('div'); msg.className='box'; msg.innerHTML='<b>Surveying the realm…</b> <span class="dim">simulating a wild year of each tile, north to south (~25 s)</span>'; $('#panel').prepend(msg);
  const cards={}; for (const t of REALM_ORDER){ msg.innerHTML=`<b>Surveying the realm…</b> <span class="dim">${REALM_TILES[t].name}</span>`; const c=await runTile(t, inflowFor(t,cards)); c.realmYear=0; c.headless=true; cards[t]=c; RS.tiles[t]=Object.assign(RS.tiles[t]||{status:'wild'}, {card:c}); draw(); }
  // wild dry-season flow arriving at the coast from the valley
  const fl=flowsBetween(); RS.wildDry = fl.C? fl.C.dry : 300; RS.surveyed=true; save(RS); msg.remove(); render(); }
layout(); render(); runSurvey();
window.REALMPAGE={ RS:()=>RS, closeYear, runTile, inflowFor, demand };

</script>
